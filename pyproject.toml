[project]
name = "jorkal"
version = "0.0.1"
description = "Jorkal is a automation solution that monitors job boards and send you notifications"
license = "./LICENSE"
authors = [
    {name = "Kyle Walters",email = "kyle@jorkle.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml (>=6.0.2,<7.0.0)",
    "cerberus (>=1.3.7,<2.0.0)",
    "nest-asyncio (>=1.6.0,<2.0.0)",
    "asyncio (>=3.4.3,<4.0.0)",
    "aiosqlite (>=0.21.0,<0.22.0)",
    "beautifulsoup4 (>=4.13.3,<5.0.0)",
    "lxml (>=5.3.1,<6.0.0)",
    "selenium (>=4.29.0,<5.0.0)",
    "discord-py (>=2.5.0,<3.0.0)",
]

[project.scripts]
jorkal = "jorkal.main:run"

[tool.poetry]
packages = [
{include = "jorkal", from = "src"},
{include = "modules", from = "src/jorkal"},
{include = "types", from = "src/jorkal"},
{include = "sources", from = "src/jorkal/modules"},
{include = "destinations", from = "src/jorkal/modules"}
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.test.dependencies]
pytest = "^8.3.4"

